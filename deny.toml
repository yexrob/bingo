# cargo-deny policy. Run: cargo deny check
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # RUSTSEC-2025-0141 (M11e). `bincode` 1.3.3 is unmaintained by its authors'
  # own decision, not unsound — their announcement calls 1.3.3 complete and
  # names no defect. It reaches us only under `syntect`'s dump loader, which
  # deserializes a syntax set compiled into the binary: no input from the
  # network, a session or a file a person opened ever reaches it. Revisit if
  # the advisory ever names a defect, or if syntect moves off it.
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 loads syntect's built-in syntax dump only" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "CC0-1.0", "Unlicense", "0BSD", "Unicode-3.0", "Unicode-DFS-2016",
  "MPL-2.0", "BSL-1.0", "OpenSSL", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "serde_yml", reason = "RUSTSEC-2025-0068: unsound and archived; use serde-saphyr" },
  { crate = "serde_yaml", reason = "deprecated by its author; use serde-saphyr" },
  { crate = "html2md", reason = "GPL-3.0; use htmd" },
  { crate = "yash-syntax", reason = "GPL-3.0; use tree-sitter-bash + shlex" },
  { crate = "birdcage", reason = "archived and GPL-3.0" },
  { crate = "figment", reason = "unmaintained since 2024; the settings merge is hand-rolled" },
  { crate = "openssl-sys", reason = "rustls only" },
  { crate = "reqwest-eventsource", reason = "pins reqwest 0.12; use sse-stream" },
  { crate = "onig", reason = "a C regex engine; syntect runs on regex-fancy (M11e)" },
  { crate = "onig_sys", reason = "a C regex engine; syntect runs on regex-fancy (M11e)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
