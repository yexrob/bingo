[package]
name = "bingo"
version = "0.3.1"
edition = "2024"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "stream", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
futures-util = "0.3"
async-stream = "0.3"
rsmarkdown-core = { git = "https://github.com/yexrob/rsmarkdown-tui" }
async-trait = "0.1.91"
rmcp = { version = "3.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
globset = "0.4.20"
regex = "1.13.1"
html2md = "0.2.15"
url = "2.5.8"
percent-encoding = "2"
http = "1"
schemars = { version = "0.8", features = ["derive"] }
unicode-width = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
flate2 = "1"
tar = "0.4"

# zune-jpeg 0.5.15（image 的 jpeg 后端，约束 ^0.5.5）在 rustc ≥1.96 下编译失败
# （`warn!` 尾分号 lint 升级为 error：macro expansion ends with an incomplete expression）。
# 上游 dev 分支已修复且 version 字段未 bump（仍 0.5.15）——git patch 无版本号替换，
# 满足 image 的 ^0.5.5 约束且编译通过。zune-core 必须同步 patch（同一 rev）：
# dev 分支的 zune-jpeg 引用 git 内 zune-core，两源类型不统一会导致 image 编译失败。
# 0.5.16 正式发布后移除本 patch 段。
[patch.crates-io]
zune-core = { git = "https://github.com/etemesi254/zune-image", rev = "0346b875169ed528e206441c97899d99002e17ca" }
zune-jpeg = { git = "https://github.com/etemesi254/zune-image", rev = "0346b875169ed528e206441c97899d99002e17ca" }

[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false }

[dev-dependencies]
