[package]
name = "bingo"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "stream", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
futures-util = "0.3"
async-stream = "0.3"
rsmarkdown-core = { git = "https://github.com/yexrob/rsmarkdown-tui" }
async-trait = "0.1.91"
rmcp = { version = "3.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
globset = "0.4.20"
regex = "1.13.1"
html5ever = "0.27.0"
markup5ever_rcdom = "0.3.0"
url = "2.5.8"
percent-encoding = "2"
http = "1"
schemars = { version = "0.8", features = ["derive"] }
unicode-width = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
tar = "0.4"

# zune-jpeg 0.5.15 (image's jpeg backend, constrained ^0.5.5) fails to build on rustc ≥1.96
# (the `warn!` trailing-semicolon lint was upgraded to an error: macro expansion ends with an incomplete expression).
# The upstream dev branch fixed it without bumping the version field (still 0.5.15) — a git patch has no version substitution,
# satisfies image's ^0.5.5 constraint and compiles. zune-core must be patched in sync (same rev):
# the dev-branch zune-jpeg references the in-git zune-core; mismatched sources would break the image build.
# Remove this patch block once 0.5.16 ships.
[patch.crates-io]
zune-core = { git = "https://github.com/etemesi254/zune-image", rev = "0346b875169ed528e206441c97899d99002e17ca" }
zune-jpeg = { git = "https://github.com/etemesi254/zune-image", rev = "0346b875169ed528e206441c97899d99002e17ca" }

[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false }

[dev-dependencies]
