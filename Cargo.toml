[package]
name = "bingo"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
futures-util = "0.3"
async-stream = "0.3"
rsmarkdown-core = { git = "https://github.com/yexrob/rsmarkdown-tui" }
async-trait = "0.1.91"
rmcp = { version = "3.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
globset = "0.4.20"
regex = "1.13.1"
html2md = "0.2.15"
url = "2.5.8"
http = "1"
schemars = { version = "0.8", features = ["derive"] }
iocraft = "0.8.4"
unicode-width = "0.1"
crossterm = "0.29"
libc = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

[dev-dependencies]
