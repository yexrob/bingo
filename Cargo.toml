[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/yexrob/bingo"

[workspace.dependencies]
bingo-sdk = { path = "crates/bingo-sdk", version = "0.1.0" }
bingo-core = { path = "crates/bingo-core", version = "0.1.0" }
bingo-provider-fake = { path = "crates/bingo-provider-fake", version = "0.1.0" }
bingo-tool-fs = { path = "crates/bingo-tool-fs", version = "0.1.0" }
bingo-surface-print = { path = "crates/bingo-surface-print", version = "0.1.0" }
bingo-provider-anthropic = { path = "crates/bingo-provider-anthropic", version = "0.1.0" }
bingo-provider-openai = { path = "crates/bingo-provider-openai", version = "0.1.0" }
bingo-tool-bash = { path = "crates/bingo-tool-bash", version = "0.1.0" }
bingo-permissions = { path = "crates/bingo-permissions", version = "0.1.0" }
bingo-tool-web = { path = "crates/bingo-tool-web", version = "0.1.0" }
bingo-store-jsonl = { path = "crates/bingo-store-jsonl", version = "0.1.0" }
bingo-context = { path = "crates/bingo-context", version = "0.1.0" }
bingo-surface-rpc = { path = "crates/bingo-surface-rpc", version = "0.1.0" }
bingo-surface-tui = { path = "crates/bingo-surface-tui", version = "0.1.0" }
bingo-skills = { path = "crates/bingo-skills", version = "0.1.0" }
bingo-mcp = { path = "crates/bingo-mcp", version = "0.1.0" }
bingo-hooks-shell = { path = "crates/bingo-hooks-shell", version = "0.1.0" }
bingo-agents = { path = "crates/bingo-agents", version = "0.1.0" }
bingo-rooms = { path = "crates/bingo-rooms", version = "0.1.0" }
bingo-tasks = { path = "crates/bingo-tasks", version = "0.1.0" }
bingo-demo-ui = { path = "crates/bingo-demo-ui", version = "0.1.0" }
bingo-auth-oauth = { path = "crates/bingo-auth-oauth", version = "0.1.0" }
bingo-plugin-rpc = { path = "crates/bingo-plugin-rpc", version = "0.1.0" }
bingo-experience = { path = "crates/bingo-experience", version = "0.1.0" }
bingo-channels = { path = "crates/bingo-channels", version = "0.1.0" }
bingo-schedule = { path = "crates/bingo-schedule", version = "0.1.0" }

tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "fs", "process", "signal"] }
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }
futures = "0.3.34"
async-trait = "0.1.92"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
schemars = "1.2"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ulid = { version = "3.0", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
tracing = "0.1"
# M17 (ADR-0020 §6): the gateway log is the first place in this tree where a
# `warn!` lands. Measured at +4 unique crates (298 → 302: tracing-subscriber,
# sharded-slab, thread_local, lazy_static), under the ADR's +5 ceiling, so the
# hand-rolled Subscriber is not needed. `fmt` only: no `ansi` (a log file wants
# no escapes), no `env-filter` (which would pull the regex stack).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
# Image files reach the model as base64 parts. `simd-unsafe` is off: this
# workspace forbids unsafe, and a Read tool is not a throughput problem.
base64 = { version = "0.23", default-features = false, features = ["std"] }
insta = { version = "1.48", features = ["json"] }
tempfile = "3.27"
# M1 (docs/plans/M1-provider-tools-gate.md, "Dependencies")
reqwest = { version = "0.13", features = ["json", "stream"] }
similar = "3.2"
ignore = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
shlex = "2.0"
process-wrap = { version = "10.0", features = ["tokio1"] }
jsonc-parser = { version = "0.33", features = ["serde"] }
wiremock = "0.6"
proptest = "1.11"
# M2 (docs/plans/M2-second-provider-catalog-web.md)
url = "2.5.8"
# M2 (docs/plans/M2-second-provider-catalog-web.md)
dom_smoothie = "0.18.0"
# M2 (docs/plans/M2-second-provider-catalog-web.md)
htmd = "0.5.5"
# M2 (docs/plans/M2-second-provider-catalog-web.md)
regex = "1.13.1"
# M6 (docs/plans/M6-tui-mvp.md)
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
# M6 (docs/plans/M6-tui-mvp.md)
crossterm = { version = "0.29", features = ["event-stream"] }
# M6 (docs/plans/M6-tui-mvp.md)
pulldown-cmark = { version = "0.13", default-features = false }
# M11a (docs/plans/M11a-frame.md, "Dependencies"): the full-screen surface
# through a real pty, so what the shell is left with after `exit` is asserted
# on a real terminal. Dev-only: neither reaches the shipped binary.
portable-pty = "0.9"
vt100 = "0.16"
# M6 (docs/plans/M6-tui-mvp.md)
unicode-width = "0.2"
# M6 (docs/plans/M6-tui-mvp.md)
unicode-segmentation = "1.13"
# M7 (docs/plans/M7-hooks-skills-mcp.md). `serialize` is off: frontmatter is
# read, never written, and `serde_yml`/`serde_yaml` are banned in deny.toml.
serde-saphyr = { version = "1.1", default-features = false, features = ["deserialize"] }
# M7 (docs/plans/M7-hooks-skills-mcp.md)
rmcp = { version = "3.1", default-features = false }
# M10 (docs/plans/M10-oauth-codex.md). SHA-256 and the system random source
# for PKCE; already resolved under rustls, so this is an edge, not a crate.
aws-lc-rs = "1"
# M11e (docs/plans/M11e-content-kinds.md, "Dependencies"). Pure Rust: the
# `fancy-regex` engine, never `onig` (a C library, banned in deny.toml). No
# themes are loaded — a scope maps onto the token table (design §4) — so
# `default-themes`, `plist-load`, `html` and `metadata` stay off.
syntect = { version = "5.3", default-features = false, features = [
  "parsing",
  "default-syntaxes",
  "regex-fancy",
] }
two-face = { version = "0.5", default-features = false, features = [
  "syntect-fancy",
] }
# M11e: the `@` completion's ranking. `unicode-segmentation` is already in the
# tree for the composer's graphemes, so this is one crate and an edge.
nucleo-matcher = "0.3"
# M11e: the terminal's own background, read once at start (OSC 10/11), so the
# truecolor palette can be the one a person's terminal is already wearing.
terminal-colorsaurus = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
