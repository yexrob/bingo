name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: bingo-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bingo-x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bingo-aarch64-apple-darwin
          # Intel Macs: cross-compiled from the arm64 runner (no extra toolchain needed).
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: bingo-x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/bingo.exe dist/bingo.exe
            # Zip lives next to the tarballs (repo root) so the artifact glob below matches.
            powershell -NoProfile -Command "Compress-Archive -Path dist/bingo.exe -DestinationPath ${{ matrix.artifact }}.zip -Force"
          else
            cp target/${{ matrix.target }}/release/bingo dist/bingo
            tar -czf ${{ matrix.artifact }}.tar.gz -C dist bingo
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Release semantics: a tag on main is the official package; a tag elsewhere
      # (e.g. dev) is a preflight build → published as a pre-release.
      # Single upload job: concurrent softprops uploads to one release race each other.
      - name: Classify release (main = official, else preflight)
        id: release_kind
        run: |
          git fetch origin main --depth=1
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd assets
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.release_kind.outputs.prerelease }}
          files: assets/*
