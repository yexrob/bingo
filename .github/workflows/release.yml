name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and release identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches Cargo package version
        run: python scripts/check_release_version.py --tag "${GITHUB_REF_NAME}"
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --locked --all-targets
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked --all-targets

  build:
    name: Build and smoke ${{ matrix.artifact }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: bingo-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bingo-x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bingo-aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: bingo-x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/bingo.exe dist/bingo.exe
            powershell -NoProfile -Command "Compress-Archive -Path dist/bingo.exe -DestinationPath ${{ matrix.artifact }}.zip -Force"
          else
            cp target/${{ matrix.target }}/release/bingo dist/bingo
            tar -czf ${{ matrix.artifact }}.tar.gz -C dist bingo
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke unpacked archive and binary version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python scripts/smoke_release_archive.py "${{ matrix.artifact }}.$([[ '${{ runner.os }}' == 'Windows' ]] && echo zip || echo tar.gz)" --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify release (main = official, else preflight)
        id: release_kind
        run: |
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.release_kind.outputs.prerelease }}
          files: release-assets/*
