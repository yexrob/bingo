[package]
name = "bingo-tool-bash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Bash tool plugin for bingo"

[lints]
workspace = true

[dependencies]
bingo-sdk.workspace = true
async-trait.workspace = true
# M16: a job's card says when it started, and the sdk re-exports no clock.
jiff.workspace = true
process-wrap.workspace = true
schemars.workspace = true
# M16: `notify_regex` is a caller's pattern over a job's output (ADR-0018 §4).
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
tokio.workspace = true
tracing.workspace = true
# M16: a job's id is the tail of a ULID, as an experience entry's is.
ulid.workspace = true

[dev-dependencies]
bingo-sdk = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# M21: `tokio::time::pause`, so the ongoing watch's thirty-second quiet window
# costs a test no wall clock at all (ADR-0018 §8). Already in the tree.
tokio = { workspace = true, features = ["test-util"] }
