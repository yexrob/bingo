[package]
name = "bingo-rooms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Rooms plugin for bingo: a room is a session nobody answers, and a post reaches every member"

[lints]
workspace = true

[dependencies]
bingo-sdk.workspace = true
async-trait.workspace = true
# M18: `OpenRoom`'s argument type is the schema the model is shown, derived
# from it rather than written twice.
schemars.workspace = true
# M9: a room a project declares is a value read out of the team file, and a
# room's membership is a payload. M83: the file itself belongs to another
# plugin and reaches here as JSON through a service (ADR-0031).
serde.workspace = true
serde_json.workspace = true
# M9: a hook has nobody to return an error to; a member nobody is, and a team
# file that will not parse, are reported here.
tracing.workspace = true
# M9: asking for the team file's rooms fails in two ways worth telling apart —
# the owner could not read the file, or its `rooms` is not a roster.
thiserror.workspace = true
# M19 (ADR-0022 §3): the chaser is one bounded timer per open mention, and a
# nudge is sent from it. Already in the tree.
tokio.workspace = true
# M19: how long a question has gone unanswered is the difference between two
# `jiff::Timestamp`s, which is what the journal stamps an item with.
jiff.workspace = true

[dev-dependencies]
bingo-sdk = { workspace = true, features = ["testing"] }
# M9: the attachment the host double hands back carries a frame stream.
futures.workspace = true
# M19: `tokio::time::pause`, so 300 seconds of patience costs a test none.
tokio = { workspace = true, features = ["test-util"] }
