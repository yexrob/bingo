[package]
name = "bingo-provider-anthropic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Anthropic Messages API provider plugin for bingo"

[lints]
workspace = true

[dependencies]
bingo-sdk.workspace = true
# The credential store a pasted key rests in (ADR-0012 §2, ADR-0017 §4): the
# library tier, which any plugin may depend on. No new external crate.
bingo-auth-oauth.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
# `retry-after` may be an HTTP date instead of a delay in seconds.
jiff.workspace = true

[dev-dependencies]
bingo-sdk = { workspace = true, features = ["testing"] }
insta.workspace = true
# A credential store a test can write to without touching the real one.
tempfile.workspace = true
wiremock.workspace = true
# `tokio::time::pause`, so the 60s idle guard costs a test no wall time.
tokio = { workspace = true, features = ["test-util"] }
