[package]
name = "bingo-surface-print"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Headless --print surface plugin for bingo"

[lints]
workspace = true

[dependencies]
bingo-sdk.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde_json.workspace = true
# `--image` takes a path or a URL, and a stream-json block may carry a type no
# provider takes: both are read and widened here (M47, ADR-0041).
bingo-pictures.workspace = true

[dev-dependencies]
bingo-sdk = { workspace = true, features = ["testing"] }
# Frame timestamps in the fixtures; the surface itself mints none.
jiff.workspace = true
# The stream-json lines are a wire format: snapshots are the fixture.
insta.workspace = true
# The pictures the tests hand over, drawn by the crate that reads them back.
bingo-pictures = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# The wider picture in a stream-json block is base64 on the wire.
base64.workspace = true
