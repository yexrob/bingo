[package]
name = "bingo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "bingo: a local coding-agent harness"

[lints]
workspace = true

[dependencies]
bingo-sdk.workspace = true
bingo-core.workspace = true
bingo-provider-fake.workspace = true
bingo-provider-anthropic.workspace = true
bingo-provider-openai.workspace = true
bingo-provider-acp.workspace = true
bingo-tool-fs.workspace = true
bingo-tool-bash.workspace = true
bingo-tool-web.workspace = true
bingo-permissions.workspace = true
bingo-store-jsonl.workspace = true
bingo-context.workspace = true
bingo-surface-print.workspace = true
bingo-surface-rpc.workspace = true
bingo-surface-tui.workspace = true
bingo-skills.workspace = true
bingo-hooks-shell.workspace = true
bingo-mcp.workspace = true
bingo-plugin-rpc.workspace = true
bingo-agents.workspace = true
bingo-rooms.workspace = true
bingo-tasks.workspace = true
bingo-experience.workspace = true
bingo-schedule.workspace = true
bingo-checkpoints.workspace = true
bingo-demo-ui.workspace = true
bingo-channels.workspace = true
# `bingo provider add` writes a pasted key to the one credential store
# (ADR-0012 §2): the library tier, not a new external crate.
bingo-auth-oauth.workspace = true
# `bingo update`: the release the API names, the digest the list gives, and
# the two renames that replace this binary (M63, ADR-0043). A library, and
# the one place the archive names are spelled.
bingo-update.workspace = true
# Its downloads. Already in this binary's tree under the providers, so it
# costs no crate.
reqwest.workspace = true
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
# The terminal prompter behind `bingo login` implements the sdk's `Prompter`.
async-trait.workspace = true
# M17 (ADR-0020 §2): `gateway start` detaches through `ProcessSession`, so a
# resident bingo outlives the terminal without this crate spelling `unsafe`.
process-wrap.workspace = true
# The gateway's pidfile is a record on disk, so it is derived, not hand-built.
serde.workspace = true
# Its start time, in the same spelling the schedule store writes.
jiff.workspace = true
# M17 (ADR-0020 §6): the gateway installs the tracing sink; `warn!` from any
# plugin lands in `gateway.log` instead of nowhere.
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
bingo-sdk = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# A schedule entry written by hand carries timestamps, and the black-box
# tests need one that is overdue (M16). Already in the tree.
jiff.workspace = true
# Black-box turns against a scripted HTTP endpoint (`--provider openai`, WebFetch).
wiremock.workspace = true
# The fake issuer's tokens are JWTs whose claims the codex provider reads.
base64.workspace = true
tokio.workspace = true
# The JSON-RPC harness drives a spawned `bingo serve --stdio` through RemoteKernel.
futures.workspace = true
# The terminal surface through a real pty (M11a): what the shell is left with
# after `exit` is a terminal question, not a unit-test one.
# The picture the pty test writes into the session's directory, drawn by the
# crate that reads it back (M46).
bingo-pictures = { workspace = true, features = ["testing"] }
portable-pty.workspace = true
vt100.workspace = true
# M39 (ADR-0036 §3): the tool bridge end to end — a real MCP client speaking
# through a spawned `bingo acp-mcp-proxy` to a live listener.
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
async-trait.workspace = true
