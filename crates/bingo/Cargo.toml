[package]
name = "bingo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "bingo: a local coding-agent harness"

[lints]
workspace = true

[dependencies]
bingo-sdk.workspace = true
bingo-core.workspace = true
bingo-provider-fake.workspace = true
bingo-provider-anthropic.workspace = true
bingo-provider-openai.workspace = true
bingo-tool-fs.workspace = true
bingo-tool-bash.workspace = true
bingo-tool-web.workspace = true
bingo-permissions.workspace = true
bingo-store-jsonl.workspace = true
bingo-context.workspace = true
bingo-surface-print.workspace = true
bingo-surface-rpc.workspace = true
bingo-surface-tui.workspace = true
bingo-skills.workspace = true
bingo-hooks-shell.workspace = true
bingo-mcp.workspace = true
bingo-agents.workspace = true
bingo-rooms.workspace = true
bingo-tasks.workspace = true
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
# The terminal prompter behind `bingo login` implements the sdk's `Prompter`.
async-trait.workspace = true

[dev-dependencies]
bingo-sdk = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# Black-box turns against a scripted HTTP endpoint (`--provider openai`, WebFetch).
wiremock.workspace = true
# The fake issuer's tokens are JWTs whose claims the codex provider reads.
base64.workspace = true
tokio.workspace = true
# The JSON-RPC harness drives a spawned `bingo serve --stdio` through RemoteKernel.
futures.workspace = true
