[package]
name = "bingo-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Tasks plugin for bingo: a session's task list, kept in its own journal"

[lints]
workspace = true

[dependencies]
bingo-sdk.workspace = true
async-trait.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# M9: a payload in the journal that is not a task list is worth saying out
# loud, and there is nobody to return it to.
tracing.workspace = true

[dev-dependencies]
bingo-sdk = { workspace = true, features = ["testing"] }
# M9: an attachment carries a frame stream, and the double hands back an empty one.
futures.workspace = true
# M9: a `SessionSummary` the double writes down is stamped with a `jiff::Timestamp`.
jiff.workspace = true
tokio.workspace = true
