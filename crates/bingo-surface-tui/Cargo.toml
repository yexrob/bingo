[package]
name = "bingo-surface-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Full-screen terminal surface plugin for bingo"

[lints]
workspace = true

[dependencies]
bingo-sdk.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tracing.workspace = true
jiff.workspace = true
ratatui.workspace = true
crossterm.workspace = true
pulldown-cmark.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
# OSC 52 puts a selection on the terminal's clipboard, which is base64 on the
# wire (M11a). Already in the workspace tree for the fs tool's image parts.
base64.workspace = true
syntect.workspace = true
# Word-level emphasis inside a changed pair of diff rows (M11e). Already in
# the workspace tree for the fs tool's edits, so it costs no crate.
similar.workspace = true
two-face.workspace = true
nucleo-matcher.workspace = true
terminal-colorsaurus.workspace = true
ignore.workspace = true

[dev-dependencies]
bingo-sdk = { workspace = true, features = ["testing"] }
insta.workspace = true
tempfile.workspace = true
# Virtual time, so "an idle surface draws nothing in two seconds" is a test
# that takes no time at all (M11a).
tokio = { workspace = true, features = ["test-util"] }
