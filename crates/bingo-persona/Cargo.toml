[package]
name = "bingo-persona"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Persona plugin for bingo: the stance the agent takes when it disagrees"

[lints]
workspace = true

[dependencies]
bingo-sdk.workspace = true
async-trait.workspace = true
# M99 (ADR-0059 §1): the one claimed key is a slice the kernel validates
# against a schema and hands over as JSON. Both already in the tree.
schemars.workspace = true
serde.workspace = true

[dev-dependencies]
# M99: the contributor is asked through a `ContextQuery`, which carries a host.
bingo-sdk = { workspace = true, features = ["testing"] }
# M99: a `SessionSummary` the double writes down is stamped with a `jiff::Timestamp`.
jiff.workspace = true
# M99: the empty settings slice a registrar is built with.
serde_json.workspace = true
tokio.workspace = true
