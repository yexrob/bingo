[package]
name = "bingo-context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Context plugin for bingo: the summary compactor, instruction files, project memory"

[lints]
workspace = true

[dependencies]
bingo-sdk.workspace = true
async-trait.workspace = true
futures.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
bingo-sdk = { workspace = true, features = ["testing"] }
# M4: the summary prompt is a wire the model reads, so a wording change is a
# deliberate diff.
insta.workspace = true
# M4: a journal item is stamped with a `jiff::Timestamp`, so writing one down
# needs one.
jiff.workspace = true
# M4: "a cut never splits a tool round" is a property of every journal, not of
# the three this file writes down.
proptest.workspace = true
tempfile.workspace = true
