[package]
name = "bingo-tool-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Filesystem tools plugin for bingo: Read, Glob, Grep, Edit, Write, AskUserQuestion"

[lints]
workspace = true

[dependencies]
bingo-sdk.workspace = true
# M104: `Read` hands the model a picture, and how big a picture a model is
# sent is decided in one place (ADR-0062 §2). A library, which any plugin may
# depend on (ADR-0012 §1).
bingo-pictures.workspace = true
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
ignore.workspace = true
globset.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
similar.workspace = true

[dev-dependencies]
bingo-sdk = { workspace = true, features = ["testing"] }
# The pictures a test reads back are drawn by the crate that bounds them, so
# this crate needs no decoder of its own and no bytes pasted into a source.
bingo-pictures = { workspace = true, features = ["testing"] }
tempfile.workspace = true
