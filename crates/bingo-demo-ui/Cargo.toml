[package]
name = "bingo-demo-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A demo plugin for bingo: the three lanes of ADR-0013, end to end"

[lints]
workspace = true

[dependencies]
bingo-sdk.workspace = true
async-trait.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# M11d: the progress tool publishes on a clock, which is a sleep between signals.
tokio.workspace = true

[dev-dependencies]
bingo-sdk = { workspace = true, features = ["testing"] }
# M11d: the doubles hand back an attachment, which carries a frame stream.
futures.workspace = true
# M11d: a `SessionSummary` the double writes down is stamped with a timestamp.
jiff.workspace = true
tokio = { workspace = true, features = ["test-util"] }
