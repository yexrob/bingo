<!--
  What the keyless endpoint answered on 2026-08-29 instead of results: an
  anti-bot challenge, with HTTP 200 and no result block in it. Recorded from
  https://html.duckduckgo.com/html/?q=rust+async+book and trimmed to the modal;
  the opaque challenge tokens are elided.

  Without the marker this file carries, a challenge is indistinguishable from a
  search that found nothing.
-->
<!DOCTYPE html>
<html lang="en">
<body>
  <form id="challenge-form" action="//duckduckgo.com/anomaly.js?sv=html&amp;q=rust async book" method="POST">
    <div class="anomaly-modal__mask">
      <div class="anomaly-modal__modal is-ie" data-testid="anomaly-modal">
        <div class="anomaly-modal__title">Unfortunately, bots use DuckDuckGo too.</div>
        <div class="anomaly-modal__description">Please complete the following challenge to confirm this search was made by a human.</div>
        <div class="anomaly-modal__instructions">Select all squares containing a duck:</div>
        <div class="anomaly-modal__puzzle-margins">
          <div class="anomaly-modal__puzzle">
            <div class="anomaly-modal__box" data-index="0">
              <label class="" for="image-check_0" data-testid="anomaly-modal-tile-0"></label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</body>
</html>
