# Hard limits enforced by scripts/budget.sh. Raise only with an ADR line.
# The count is of every crate in the workspace's normal tree, members included,
# so a new member costs one: 268 → 269 is `bingo-demo-ui` (M11d, ADR-0013),
# which brings no dependency of its own.
# M11e (docs/plans/M11e-content-kinds.md) raises 269 → 282 by the measured 13:
# syntect + two-face and their seven shared edges (+9), nucleo-matcher (+1),
# terminal-colorsaurus with terminal-trx and xterm-color (+3). `ignore` was
# already in the tree, so the `@` completion's walk costs nothing. Images were
# measured at +33 (`image` +9, `ratatui-image` +24 for its sixel quantiser) and
# refused: they stay at the `[image: name]` degrade of design §5.
# M14 (docs/plans/M14-experience-bridge.md, ADR-0014/0015) raises 282 → 284
# for the two new members, `bingo-plugin-rpc` and `bingo-experience`. Neither
# brings a dependency of its own: the bridge's framing is serde_json over
# lines on `tokio::process`, and the library's BM25 is the zero-dep brick,
# its frontmatter `serde-saphyr`, its id `ulid`, its commit-card diff
# `similar` — all already in the tree.
# M13 (docs/plans/M13-channels.md) raises 284 → 297 by the measured 13. One
# is the member `bingo-channels`; the other twelve are `tokio-tungstenite`
# and what it pulls — `tungstenite`, `data-encoding` and `rustls-native-certs`
# for the handshake, and `sha1` with its RustCrypto stack (digest,
# block-buffer, crypto-common, hybrid-array, typenum, const-oid, cpufeatures)
# for `Sec-WebSocket-Accept`. rustls only: `native-tls` is off and
# `openssl-sys` is banned in deny.toml. The Deliverer, the loopback and the
# Feishu HTTP side add nothing: `reqwest` and `base64` were already in the tree.
# M16 (docs/plans/M16-background-work.md, ADR-0019) raises 297 → 298 by the
# one member `bingo-schedule`. It brings no crate of its own: the clock is
# `jiff`, the id `ulid`, the creation card's diff `similar`, and the runner is
# `tokio` — all already in the tree. Cron would have been a dependency, which
# is why the spec is three forms and a parser (ADR-0019 §2).
# M17 (docs/plans/M17-gateway.md, ADR-0020 §6) raises 298 → 302 by the measured
# 4: `tracing-subscriber` fmt-only and the three it pulls — `sharded-slab` and
# `thread_local` for the registry, `lazy_static` under them. The ADR's rule was
# +5 or hand-roll a Subscriber; +4 buys the real one. `ansi` and `env-filter`
# are off, which is what keeps `nu-ansi-term` and the regex stack out. The
# gateway itself brings nothing else: detaching is `process-wrap` and the
# service files are text.
# M38 (docs/plans/M38-an-agent-answers-as-a-model.md, ADR-0035 §2) raises
# 302 → 308 by the measured 6. Five are `agent-client-protocol-schema` and its
# edges — `anyhow`, `serde_with`, `serde_with_macros`, `unicode-xid`; the sixth
# is the member `bingo-provider-acp` itself, which this file has always counted
# as one. The ADR wrote 307 from the research's +5, which measured the crate
# without the member. The full `agent-client-protocol` SDK was measured at +27,
# fourteen of them a second async runtime, and refused: the newline-framed
# JSON-RPC client loop is written in the plugin, in tokio, `Send`.
# M46 (docs/plans/M46-the-picture-is-seen.md, ADR-0041) raises 310 → 331 by
# the measured 21: `image` with ten decoders (+20 — image, png, fdeflate,
# zune-jpeg, zune-core, gif, color_quant, weezl, image-webp, tiff, fax,
# qoi, moxcms, pxfm, half, bytemuck, byteorder-lite, quick-error, zerocopy,
# zerocopy-derive) and the member `bingo-pictures` (+1). M11e refused images
# at +33 because `ratatui-image`'s sixel quantiser was two thirds of it; the
# kitty path needs no quantiser, so what is bought here is the decoders
# alone. Default features are off: no `rayon`, no `default-formats`.
# M54 (docs/plans/M54-the-page-that-answers-back.md, ADR-0042) raises 331 → 332
# by the one member `bingo-loopback`. It brings no crate of its own: the
# listener is `tokio` `net`, the answer `serde_json`, the token `getrandom` and
# `base64` — all already in the tree — and its tests speak HTTP by hand rather
# than pull `reqwest` into a library that has to cross-check for Windows.
# M63 (docs/plans/M63-the-binary-that-replaces-itself.md, ADR-0043) raises
# 332 → 333 by the one member `bingo-update`. It brings no crate of its own:
# the release answer is `serde_json`, the stamp's clock `jiff`, the settings
# schema `schemars`, and the digest is written out in `sha256.rs` — `sha2` is
# in the lock file only as a dev edge of the pty harness (`portable-pty` →
# `termwiz`) and `semver` only as a build edge (`rustc_version`), so neither
# is in the normal tree and taking either would have cost a crate each.
# `aws-lc-rs` has SHA-256 and is in the tree, but it builds C, which would
# have cost this crate the Windows cross-check its rename dance needs
# (ADR-0041's note; ADR-0043 §3). The fetch is the caller's, so `reqwest`
# stays out of the library as it does out of `bingo-loopback`.
# M67 (docs/plans/M67-the-turn-that-can-be-undone.md, ADR-0045) raises
# 333 → 334 by the one member `bingo-checkpoints`. It brings no crate of its
# own: a snapshot is `std::fs`, the index is a line of text, the tool call's
# path is read out of `serde_json`, and a snapshot that failed is a `tracing`
# line — all already in the tree.
max_dependencies = 334
max_core_check_seconds = 20
max_target_gb = 5
